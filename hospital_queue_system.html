<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hospital Queue System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root{
          --bg: linear-gradient(180deg,#071022 0%, #041423 100%);
          --card:#0b1220; --accent:#06b6d4; --muted:#94a3b8; --glass: rgba(255,255,255,0.03); --text:#e6eef6;
      }
        /* Light theme overrides */
        .light-theme{
          --bg: linear-gradient(180deg,#f8fafc 0%, #eef2ff 100%);
          --card: #ffffff; --accent:#0ea5a4; --muted:#475569; --glass: rgba(2,6,23,0.04); --text:#0b1220;
        }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
          margin:0; font-family:'Inter',system-ui,Arial; background:var(--bg); color:var(--text);
        display:flex; align-items:center; justify-content:center; padding:36px;
      }
      .app{width:100%; max-width:1000px}
      .header{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px}
      .brand{display:flex; gap:12px; align-items:center}
      .logo{width:56px; height:56px; border-radius:12px; background:linear-gradient(135deg,#06b6d4,#7c3aed); display:flex; align-items:center; justify-content:center; font-weight:800}
      h1{margin:0; font-size:20px}
      .sub{color:var(--muted); font-size:13px}

      .layout{display:grid; grid-template-columns:260px 1fr; gap:18px}

      /* Sidebar (menu) */
      .sidebar{background:var(--card); border-radius:12px; padding:14px; box-shadow:0 6px 18px rgba(2,6,23,0.6)}
      .menu{display:flex; flex-direction:column; gap:8px}
      .menu button{background:var(--glass); border:1px solid rgba(255,255,255,0.03); color:inherit; padding:10px 12px; border-radius:8px; cursor:pointer; text-align:left; font-weight:600}
      .menu button.active{background:linear-gradient(90deg, rgba(6,182,212,0.12), rgba(124,58,237,0.08)); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.02)}

      /* Main card */
      .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent); border-radius:12px; padding:20px; min-height:420px}

      .form{display:flex; flex-direction:column; gap:10px; max-width:520px}
      label{font-size:13px; color:var(--muted)}
      input[type=text], input[type=number], select{padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.04); background:transparent; color:inherit}
      .row{display:flex; gap:10px}
      .row .col{flex:1}
      .controls{display:flex; gap:10px; margin-top:6px}
      .btn{padding:10px 14px; border-radius:10px; border:none; cursor:pointer; font-weight:700}
      .btn.primary{background:var(--accent); color:#06202a}
      .btn.ghost{background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--muted)}

      /* Severity buttons */
      .sev-btn{padding:8px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.06); cursor:pointer; font-weight:700; background:transparent}
      .sev-btn.active{box-shadow:0 6px 18px rgba(2,6,23,0.3); transform:translateY(-1px)}
      .sev-critical{background:linear-gradient(90deg,#ef4444,#dc2626); color:white; border:none}
      .sev-moderate{background:linear-gradient(90deg,#f59e0b,#d97706); color:white; border:none}
      .sev-mild{background:linear-gradient(90deg,#10b981,#059669); color:white; border:none}

      /* Queue list */
      .queue{margin-top:12px}
      table{width:100%; border-collapse:collapse}
      th,td{padding:12px; text-align:left; border-bottom:1px dashed rgba(255,255,255,0.03); font-size:14px}
      .badge{display:inline-block; padding:6px 10px; border-radius:999px; font-weight:700; font-size:12px}
      .high{background:#ef4444; color:white}
      .med{background:#f59e0b; color:white}
      .low{background:#10b981; color:white}

      .empty{padding:28px; text-align:center; color:var(--muted); border-radius:8px}

      .footer{margin-top:14px; display:flex; gap:8px; align-items:center}

      .toast{position:fixed; right:18px; bottom:18px; background:#052226; color:#c1fbff; padding:12px 14px; border-radius:10px; box-shadow:0 8px 30px rgba(2,6,23,0.6)}

      @media(max-width:820px){.layout{grid-template-columns:1fr;}.sidebar{order:2}}
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="brand">
          <div class="logo">H</div>
          <div>
            <h1>Hospital Queue System</h1>
            <div class="sub">Manage patients by priority — Critical first</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <div class="sub">Interactive dashboard — Add, View, Treat, Exit</div>
          <button id="theme-toggle" onclick="toggleTheme()" title="Toggle theme" style="background:transparent;border:1px solid rgba(255,255,255,0.04);padding:6px 8px;border-radius:8px;cursor:pointer">🌙</button>
        </div>
      </div>

      <div class="layout">
        <aside class="sidebar">
          <div style="font-weight:700; margin-bottom:8px">Menu</div>
          <div class="menu">
            <button id="menu-add" class="active" onclick="showSection('add')">1. Add Patient</button>
            <button id="menu-display" onclick="showSection('display')">2. Display Queue</button>
            <button id="menu-treat" onclick="treatPatient()">3. Treat Patient</button>
            <button id="menu-exit" onclick="exitApp()">4. Exit</button>
          </div>
          <div style="margin-top:14px; color:var(--muted); font-size:13px">Queue size: <span id="queue-size">0</span></div>
          <div style="margin-top:10px">
            <label style="font-size:13px;color:var(--muted);">Max queue size</label>
            <div style="display:flex; gap:8px; margin-top:6px; align-items:center">
              <input id="max-size" type="number" min="0" value="100" style="width:110px; padding:8px; border-radius:6px; background:transparent; border:1px solid rgba(255,255,255,0.04); color:inherit;" />
              <button class="btn ghost" onclick="applyMaxSize()">Apply</button>
            </div>
            <div style="font-size:12px;color:var(--muted); margin-top:6px">Set to 0 for unlimited</div>
          </div>
        </aside>

        <main>
          <div class="card">
            <section id="section-add">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
                <strong>Add New Patient</strong>
                <div class="sub">Higher priority appears first</div>
              </div>

              <form class="form" onsubmit="event.preventDefault(); addPatient();">
                <div class="row">
                  <div class="col">
                    <label for="name">Name</label>
                    <input id="name" type="text" placeholder="Patient name" required />
                  </div>
                  <div class="col">
                    <label for="age">Age</label>
                    <input id="age" type="number" min="0" placeholder="Age" required />
                  </div>
                </div>

                <div>
                  <label for="severity">Severity</label>
                  <div id="severity-buttons" style="display:flex; gap:8px; margin-top:6px">
                    <button type="button" class="sev-btn sev-critical active" data-severity="Critical">Critical</button>
                    <button type="button" class="sev-btn sev-moderate" data-severity="Moderate">Moderate</button>
                    <button type="button" class="sev-btn sev-mild" data-severity="Mild">Mild</button>
                  </div>
                </div>

                <div class="controls">
                  <button class="btn primary" type="submit">Add Patient</button>
                  <button type="button" class="btn ghost" onclick="clearForm()">Clear</button>
                </div>
              </form>
            </section>

            <section id="section-display" style="display:none">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
                <strong>Current Queue</strong>
                <div style="display:flex; gap:8px">
                  <button class="btn ghost" onclick="sortQueue(); displayQueue();">Refresh</button>
                  <button class="btn ghost" onclick="clearQueue(true)">Clear Queue</button>
                </div>
              </div>

              <div id="queue-container">
                <div class="empty">No patients in queue</div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div id="toast" class="toast" style="display:none"></div>

    <!-- Treat modal -->
    <div id="treat-modal" style="display:none; position:fixed; inset:0; background:rgba(2,6,23,0.6); align-items:center; justify-content:center; z-index:60">
      <div style="background:var(--card); padding:18px; border-radius:12px; width:420px; box-shadow:0 14px 40px rgba(2,6,23,0.7); color:inherit">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
          <strong>Treat Patient</strong>
          <button onclick="closeTreatModal()" style="background:transparent;border:none;color:var(--muted);cursor:pointer">✕</button>
        </div>
        <div style="margin-bottom:8px">
          <div style="font-size:13px;color:var(--muted)">Name</div>
          <div id="modal-name" style="font-weight:700; margin-bottom:6px"></div>
          <div style="display:flex; gap:10px; margin-bottom:6px">
            <div>
              <div style="font-size:13px;color:var(--muted)">Age</div>
              <div id="modal-age" style="font-weight:600"></div>
            </div>
            <div style="flex:1">
              <div style="font-size:13px;color:var(--muted)">Severity</div>
              <div id="modal-severity-buttons" style="display:flex; gap:8px; margin-top:6px">
                <button type="button" class="sev-btn sev-critical" data-severity="Critical">Critical</button>
                <button type="button" class="sev-btn sev-moderate" data-severity="Moderate">Moderate</button>
                <button type="button" class="sev-btn sev-mild" data-severity="Mild">Mild</button>
              </div>
            </div>
          </div>
        </div>
        <div style="display:flex; gap:8px; justify-content:flex-end">
          <button class="btn ghost" onclick="updatePriorityFromModal()">Update Priority</button>
          <button class="btn primary" onclick="treatNowFromModal()">Treat (downgrade)</button>
          <button class="btn" style="background:#ef4444;color:white" onclick="dischargeFromModal()">Discharge</button>
        </div>
      </div>
    </div>

    <script>
      // Priority mapping: Critical=3, Moderate=2, else=1
      const PQ = [];
      let idCounter = 0;
      let exited = false;
      let maxSize = 100; // 0 = unlimited

      function priorityFromSeverity(s){
        if(s === 'Critical') return 3;
        if(s === 'Moderate') return 2;
        return 1;
      }

      function getSelectedSeverity(groupId){
        const active = document.querySelector('#'+groupId+' .sev-btn.active');
        return active ? active.dataset.severity : 'Mild';
      }

      function setSeverityActive(groupId, severity){
        const buttons = document.querySelectorAll('#'+groupId+' .sev-btn');
        buttons.forEach(b=>{ b.classList.toggle('active', b.dataset.severity === severity); });
      }

      // attach click handlers for severity buttons
      function initSeverityButtons(){
        document.querySelectorAll('#severity-buttons .sev-btn').forEach(b=>{
          b.addEventListener('click', ()=>{ setSeverityActive('severity-buttons', b.dataset.severity); });
        });
        document.querySelectorAll('#modal-severity-buttons .sev-btn').forEach(b=>{
          b.addEventListener('click', ()=>{ setSeverityActive('modal-severity-buttons', b.dataset.severity); });
        });
      }

      function addPatient(){
        if(exited) return showToast('Session ended — cannot add');
        const name = document.getElementById('name').value.trim();
        const age = parseInt(document.getElementById('age').value,10);
        const severity = getSelectedSeverity('severity-buttons');
        if(!name || Number.isNaN(age)) return showToast('Please provide valid name and age');

        if(maxSize > 0 && PQ.length >= maxSize) return showToast('Queue is full — max ' + maxSize);

        const priority = priorityFromSeverity(severity);
        const patient = { id: ++idCounter, name, age, severity, priority, time: Date.now() };
        PQ.push(patient);
        sortQueue();
        updateQueueSize();
        clearForm();
        // ensure severity buttons are initialized
        initSeverityButtons();
        showToast('Patient added — ' + name);
      }

      function sortQueue(){
        PQ.sort((a,b)=>{
          if(b.priority !== a.priority) return b.priority - a.priority; // higher first
          return a.time - b.time; // earlier first
        });
      }

      function displayQueue(){
        const container = document.getElementById('queue-container');
        container.innerHTML = '';
        if(PQ.length === 0){
          container.innerHTML = '<div class="empty">No patients in queue</div>';
          return;
        }

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        thead.innerHTML = '<tr><th>Patient</th><th>Age</th><th>Severity</th><th>Priority</th></tr>';
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        for(const p of PQ){
          const tr = document.createElement('tr');
          const badgeClass = p.priority === 3 ? 'high' : p.priority === 2 ? 'med' : 'low';
          tr.innerHTML = `<td>${escapeHtml(p.name)}</td><td>${p.age}</td><td>${escapeHtml(p.severity)}</td><td><span class="badge ${badgeClass}">${p.priority}</span></td>`;
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        container.appendChild(table);
      }

      function treatPatient(){
        // open modal to allow changing priority or treating
        if(exited) return showToast('Session ended — cannot treat');
        if(PQ.length === 0) return showToast('No patients to treat');
        openTreatModal();
      }

      function openTreatModal(){
        sortQueue();
        const p = PQ[0];
        if(!p) return showToast('No patients to treat');
        document.getElementById('modal-name').textContent = p.name;
        document.getElementById('modal-age').textContent = p.age;
        setSeverityActive('modal-severity-buttons', p.severity);
        document.getElementById('treat-modal').style.display = 'flex';
      }

      function closeTreatModal(){
        document.getElementById('treat-modal').style.display = 'none';
      }

      function downgradeSeverity(s){
        if(s === 'Critical') return 'Moderate';
        if(s === 'Moderate') return 'Mild';
        return 'Mild';
      }

      function treatNowFromModal(){
        // Treating downgrades the patient's severity (but keeps them in queue)
        if(PQ.length === 0) { closeTreatModal(); return showToast('No patients to treat'); }
        const p = PQ[0];
        const oldSeverity = p.severity;
        const newSeverity = downgradeSeverity(oldSeverity);
        p.severity = newSeverity;
        p.priority = priorityFromSeverity(newSeverity);
        p.time = Date.now();
        sortQueue();
        updateQueueSize();
        displayQueueIfVisible();
        closeTreatModal();
        showToast('Patient treated — ' + p.name + ' (now ' + newSeverity + ')');
      }

      function dischargeFromModal(){
        if(PQ.length === 0) { closeTreatModal(); return showToast('No patients to discharge'); }
        const patient = PQ.shift();
        updateQueueSize();
        displayQueueIfVisible();
        closeTreatModal();
        showToast('Patient discharged — ' + patient.name);
      }

      function updatePriorityFromModal(){
        if(PQ.length === 0) return showToast('No patients to update');
        const newSeverity = getSelectedSeverity('modal-severity-buttons');
        const newPriority = priorityFromSeverity(newSeverity);
        const name = PQ[0].name;
        // update top patient
        PQ[0].severity = newSeverity;
        PQ[0].priority = newPriority;
        PQ[0].time = Date.now();
        sortQueue();
        updateQueueSize();
        displayQueueIfVisible();
        closeTreatModal();
        showToast('Priority updated for ' + name);
      }

      function clearQueue(confirmPrompt){
        if(confirmPrompt && !confirm('Clear the entire queue?')) return;
        PQ.length = 0;
        updateQueueSize();
        displayQueueIfVisible();
        showToast('Queue cleared');
      }

      function exitApp(){
        if(exited) return;
        if(!confirm('Exit the application? This will lock further actions.')) return;
        exited = true;
        document.querySelectorAll('input,select,button').forEach(el=>el.disabled = true);
        document.getElementById('queue-container').innerHTML = '<div class="empty">Session ended. Refresh page to restart.</div>';
        document.getElementById('queue-size').textContent = PQ.length;
        showToast('Session ended');
      }

      function showSection(name){
        ['add','display'].forEach(s=>{
          document.getElementById('section-'+s).style.display = (s===name)?'block':'none';
        });
        document.querySelectorAll('.menu button').forEach(btn=>btn.classList.remove('active'));
        document.getElementById('menu-'+name).classList.add('active');
        if(name==='display') displayQueue();
      }

      function clearForm(){
        document.getElementById('name').value = '';
        document.getElementById('age').value = '';
        setSeverityActive('severity-buttons','Critical');
      }

      function updateQueueSize(){
        document.getElementById('queue-size').textContent = PQ.length + (maxSize>0 ? ' / ' + maxSize : '');
      }

      function applyMaxSize(){
        const v = parseInt(document.getElementById('max-size').value,10);
        if(Number.isNaN(v) || v < 0) return showToast('Invalid max size');
        maxSize = v;
        updateQueueSize();
        showToast('Max queue size set to ' + (maxSize === 0 ? 'unlimited' : maxSize));
      }

      function displayQueueIfVisible(){
        if(document.getElementById('section-display').style.display !== 'none') displayQueue();
      }

      // small utility: escape text for HTML
      function escapeHtml(str){ return String(str).replace(/[&<>\"]+/g, s=>({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;' }[s])); }

      // toast
      let toastTimer = null;
      function showToast(msg){
        const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
        clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.style.display = 'none'; }, 3000);
      }

      // `treatPatient` is the single entrypoint; the menu calls it directly.

      // initial
      sortQueue(); updateQueueSize();
      // initialize severity button handlers
      initSeverityButtons();
      // Theme: load saved or default to dark
      function applyTheme(theme){
        document.body.classList.toggle('light-theme', theme === 'light');
        const btn = document.getElementById('theme-toggle');
        if(btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
        try{ localStorage.setItem('hqs-theme', theme); }catch(e){}
      }

      function toggleTheme(){
        const current = document.body.classList.contains('light-theme') ? 'light' : 'dark';
        const next = current === 'light' ? 'dark' : 'light';
        applyTheme(next);
      }

      (function(){
        try{
          const saved = localStorage.getItem('hqs-theme');
          applyTheme(saved === 'light' ? 'light' : 'dark');
        }catch(e){ applyTheme('dark'); }
      })();
      // map menu ids to sections
      document.getElementById('menu-add').id = 'menu-add';
      document.getElementById('menu-display').id = 'menu-display';
      document.getElementById('menu-treat').id = 'menu-treat';
      document.getElementById('menu-exit').id = 'menu-exit';
    </script>
  </body>
</html>
