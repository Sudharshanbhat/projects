<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact - Info Getter</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:Arial, sans-serif;background:#f5f5f5;color:#222}
        header{background:#4285F4;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:12px}
        header img{width:48px;height:48px;border-radius:50%;background:#fff}
        nav{margin-left:auto}
        nav a{color:#fff;text-decoration:none;margin-left:18px;font-weight:bold}
        main{max-width:900px;margin:36px auto;background:#fff;padding:28px;border-radius:8px}
        h1{color:#4285F4;margin-bottom:18px}
        p{font-size:16px;line-height:1.8;color:#333}
        .contact-info{background:#f8f9fa;padding:16px;border-radius:6px;margin-top:12px}
        form{margin-top:18px;display:flex;flex-direction:column;gap:10px}
        input,textarea{padding:10px;border:1px solid #ddd;border-radius:6px}
        button{background:#4285F4;color:#fff;padding:10px;border:none;border-radius:6px;cursor:pointer}
    </style>
</head>
<body>
    <header>
        <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="logo">
        <h2>Info Getter</h2>
        <nav>
            <a href="basicapp.html">Home</a>
            <a href="about.html">About</a>
            <a href="service.html">Service</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <p>If you need support or have questions, use the form below or reach out via email or phone.</p>

        <div class="contact-info">
            <p><strong>Email:</strong> support@google.com</p>
            <p><strong>Phone:</strong> +1 650-253-0000</p>
            <p><strong>Address:</strong> 1600 Amphitheatre Parkway, Mountain View, California, USA</p>
            
        </div>

        <form id="contactForm">
            <input type="text" id="name" placeholder="Your name" required>
            <input type="email" id="email" placeholder="Your email" required>
            <input type="phone number" id="phone" placeholder="Your phone number">
            <textarea id="message" rows="6" placeholder="Your message" required></textarea>
            <button type="submit">Send Message</button>
        </form>

        <p id="sent" style="display:none;margin-top:12px;color:green">Message sent (demo).</p>
    </main>

    <script src="javascript/connect.js"></script>
</body>
</html>
